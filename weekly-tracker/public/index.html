<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>每周项目追踪</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>每周项目追踪</h1>
      <div class="week-nav">
        <button id="prev-week">&larr;</button>
        <span id="week-label">加载中...</span>
        <button id="next-week">&rarr;</button>
        <input type="date" id="date-picker" style="display:none">
        <button id="date-picker-btn" title="Jump to date">&#128197;</button>
      </div>
    </header>

    <section class="summary-cards" id="summary-cards">
      <div class="card"><div class="card-value" id="stat-projects">-</div><div class="card-label">活跃项目</div></div>
      <div class="card"><div class="card-value" id="stat-commits">-</div><div class="card-label">提交数</div></div>
      <div class="card"><div class="card-value" id="stat-files">-</div><div class="card-label">文件变更</div></div>
      <div class="card"><div class="card-value" id="stat-authors">-</div><div class="card-label">贡献者</div></div>
    </section>

    <section class="project-table" id="project-table">
      <table>
        <thead>
          <tr>
            <th>项目</th>
            <th>提交数</th>
            <th>贡献者</th>
            <th>目标</th>
            <th>整体进展</th>
            <th>本周进展</th>
          </tr>
        </thead>
        <tbody id="project-rows"></tbody>
      </table>
    </section>

    <section class="ai-summary" id="ai-summary">
      <h2>AI 周报摘要</h2>
      <p id="summary-text">选择一周以查看摘要。</p>
    </section>

    <section class="qa-panel" id="qa-panel">
      <h2>项目问答</h2>
      <div class="chat-messages" id="chat-messages"></div>
      <div class="chat-input">
        <input type="text" id="question-input" placeholder="例如：这周谁提交最多？主要做了什么？">
        <button id="ask-btn">提问</button>
      </div>
    </section>
  </div>

  <script src="/chat.js"></script>
</body>
</html>
